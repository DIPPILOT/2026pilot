    const escapeHtml=(value)=>String(value??"").replace(/[&<>"']/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));

    function radarChart(values,labels){const cx=90,cy=82,radius=56;const point=(index,ratio)=>{const angle=(-90+index*120)*Math.PI/180;return [cx+Math.cos(angle)*radius*ratio,cy+Math.sin(angle)*radius*ratio]};const polygon=(ratio)=>labels.map((_,index)=>point(index,ratio).join(",")).join(" ");const valuePolygon=values.map((value,index)=>point(index,value/100).join(",")).join(" ");const axes=labels.map((_,index)=>{const [x,y]=point(index,1);return `<line class="radar-axis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`}).join("");const dots=values.map((value,index)=>{const [x,y]=point(index,value/100);return `<circle class="radar-dot" cx="${x}" cy="${y}" r="3"/>`}).join("");const labelNodes=labels.map((label,index)=>{const [x,y]=point(index,1.28);return `<text class="radar-label" x="${x}" y="${y+3}">${escapeHtml(label)}</text>`}).join("");return `<svg class="radar-chart" viewBox="0 0 180 170" role="img" aria-label="${escapeHtml(labels.join(', '))} 스파이더 그래프">${[.25,.5,.75,1].map((ratio)=>`<polygon class="radar-gridline" points="${polygon(ratio)}"/>`).join("")}${axes}<polygon class="radar-area" points="${valuePolygon}"/>${dots}${labelNodes}</svg>`}

    function renderPortfolioPage(){return `<section class="sheet" id="page-4">${pageHeader(4,"Portfolio Case Study","가상 서비스 사이트 구성과 전문가 평가 예시")}<div class="portfolio-hero"><article class="portfolio-intro"><p class="portfolio-label">FICTIONAL PRODUCT · FLOWGUARD</p><h2 contenteditable="true">FlowGuard</h2><p data-pretext contenteditable="true">팀의 업무 요청을 구조화하고 AI 제안의 근거·변경·검증 이력을 남기는 협업형 프로젝트 운영 서비스입니다. 작은 팀이 요구사항 누락과 반복 커뮤니케이션을 줄이고 릴리즈 판단을 빠르게 내리도록 돕습니다.</p></article><div class="portfolio-metrics"><div class="portfolio-metric"><strong>32%</strong><span>요구사항 재작업 감소</span></div><div class="portfolio-metric"><strong>41%</strong><span>QA 준비 시간 단축</span></div><div class="portfolio-metric"><strong>10 Days</strong><span>POC 제작 기간</span></div><div class="portfolio-metric"><strong>84/100</strong><span>전문가 종합 평가</span></div></div></div><div class="portfolio-grid"><article class="portfolio-panel"><p class="panel-kicker">PROBLEM & SOLUTION</p><h3>해결한 문제</h3><p contenteditable="true">메신저와 문서에 흩어진 요청 때문에 우선순위와 완료 기준이 자주 바뀌는 문제를 발견했습니다. 요청을 Persona, Domain, Flow, API, Test 증거로 연결하고 AI 제안은 승인·수정·거절 이력과 함께 저장하도록 설계했습니다.</p></article><article class="portfolio-panel"><p class="panel-kicker">TARGET USER</p><h3>핵심 사용자와 가치</h3><p contenteditable="true">5~20명 규모의 개발팀에서 기획·개발·QA 역할을 겸하는 실무자가 대상입니다. 무엇을 왜 만들었는지 한 화면에서 확인하고, 릴리즈 전 누락된 근거와 실패 복구 절차를 찾을 수 있습니다.</p></article><article class="portfolio-panel wide"><p class="panel-kicker">KEY EXPERIENCE</p><h3>주요 기능과 사용자 흐름</h3><ul class="feature-list"><li><strong>Requirement Inbox</strong> · 요청을 Persona·Goal·Domain 근거로 구조화</li><li><strong>Decision Ledger</strong> · AI 제안과 개발자의 승인·수정·거절 이유 기록</li><li><strong>Evidence Board</strong> · API 계약, 테스트, 배포 증거를 Feature에 연결</li><li><strong>Release Gate</strong> · 권한·QA·관측·Rollback 조건을 자동 점검</li></ul></article><article class="portfolio-panel"><p class="panel-kicker">TECH & ARCHITECTURE</p><h3>기술 구성</h3><div class="stack-row"><span class="stack-tag">React</span><span class="stack-tag">TypeScript</span><span class="stack-tag">Spring Boot</span><span class="stack-tag">PostgreSQL</span><span class="stack-tag">OpenAPI</span><span class="stack-tag">Playwright</span><span class="stack-tag">Docker</span></div><p style="margin-top:2mm">Feature 중심 모듈, REST 계약, 권한 검사, 이벤트 기반 감사 로그, 자동화된 E2E Release Gate로 구성했습니다.</p></article><article class="portfolio-panel"><p class="panel-kicker">PORTFOLIO CONTENT</p><h3>사이트에 담을 콘텐츠</h3><ul><li>문제 발견과 사용자 인터뷰 근거</li><li>설계 대안과 선택 Trade-off</li><li>AI 제안 수정·거절 사례</li><li>실패 재현과 회귀 테스트</li><li>Demo, 회고, 다음 개선 계획</li></ul></article></div><section class="evaluation"><div class="evaluation-head"><div><p class="panel-kicker">EXPERT REVIEW</p><h3>제품·기술 포트폴리오 전문가 평가</h3></div><div class="score">84 / 100</div></div><div class="score-grid"><div class="score-item"><span>문제 정의</span><strong>88</strong></div><div class="score-item"><span>사용자 경험</span><strong>82</strong></div><div class="score-item"><span>기술 설계</span><strong>86</strong></div><div class="score-item"><span>검증 증거</span><strong>80</strong></div></div><div class="review-grid"><div><h4>강점</h4><p contenteditable="true">문제에서 Domain, API, 테스트까지 결정의 흐름이 연결되어 있어 지원자의 사고 과정을 확인하기 좋습니다. AI 결과를 그대로 사용하지 않고 수정·거절한 이유를 증거로 제시한 점이 차별화됩니다.</p></div><div><h4>개선 제안</h4><p contenteditable="true">성과 수치는 측정 방식과 표본을 함께 제시해야 신뢰도가 높아집니다. 실제 사용자의 과업 성공률, 접근성 테스트, 장애·복구 사례를 보강하면 실무 역량이 더 분명하게 드러납니다.</p></div></div><p class="expert-quote" contenteditable="true">“완성 화면보다 문제 정의와 검증 과정이 잘 보이는 포트폴리오입니다. 다음 버전에서는 실제 사용자 관찰과 운영 지표를 추가해 결과의 신뢰도를 높이길 권합니다.” · 제품·기술 포트폴리오 리뷰어</p></section>${pageFooter(4)}</section>`}

    function updateTaskState(){document.querySelectorAll("[data-task]").forEach((input)=>{const card=document.querySelector(`[data-task-card="${input.dataset.task}"]`);card.classList.toggle("checked",input.checked)});const selected=[...document.querySelectorAll("[data-task]:checked")].map((input)=>input.dataset.task);localStorage.setItem("swlanding-completed-tasks",JSON.stringify(selected));document.getElementById("task-count").textContent=selected.length}document.querySelectorAll("[data-task]").forEach((input)=>input.addEventListener("change",updateTaskState));
    (async function initPretext(){await document.fonts.ready;const elements=[...document.querySelectorAll("[data-pretext]")];try{const{prepare,layout}=await import("https://esm.sh/@chenglou/pretext");const prepared=new Map();const prepareElement=(el)=>prepared.set(el,prepare(el.textContent,getComputedStyle(el).font));elements.forEach(prepareElement);const relayout=()=>prepared.forEach((handle,el)=>{if(window.matchMedia("print").matches)return;const lineHeight=parseFloat(getComputedStyle(el).lineHeight);const result=layout(handle,el.clientWidth,lineHeight);el.style.minHeight=`${Math.ceil(result.height)}px`});new ResizeObserver(relayout).observe(document.body);elements.filter((el)=>el.contentEditable==="true").forEach((el)=>{new MutationObserver(()=>{prepareElement(el);relayout()}).observe(el,{characterData:true,subtree:true,childList:true})});relayout()}catch(error){console.info("Pretext CDN을 사용할 수 없어 브라우저 기본 줄바꿈을 사용합니다.")}})();
