    const escapeHtml=(value)=>String(value??"").replace(/[&<>"']/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
    const completedDays=new Set(participant.completedDays);const storedTasks=JSON.parse(localStorage.getItem("swlanding-completed-tasks")||"null");const completedTasks=new Set(Array.isArray(storedTasks)?storedTasks:participant.completedTasks);
    function pageHeader(page,title,subtitle){const kicker=page===4?"PORTFOLIO · EXPERT REVIEW":"2026 SW LANDING · DAEGU";return `<header class="page-header"><div><p class="brand-kicker">${kicker}</p><h1 class="brand-title">${escapeHtml(title)}</h1><p class="brand-subtitle">${escapeHtml(subtitle)}</p></div><span class="page-number">${page} / 4</span></header>`}
    function pageFooter(page){return `<footer class="page-footer"><span>2026 대구 SW 랜딩 · AI Agent 10 Days</span><span>${escapeHtml(participant.name)} · ${page} / 4</span></footer>`}
    function renderDay(day){const moduleNumber=moduleForDay(day.day);const module=participant.modules[moduleNumber];const attendance=participant.dayAttendance?.[day.day];const complete=attendance?.state==="present";const statusText=attendance?`${attendance.label} · ${attendance.date}`:module.status;return `<article class="day-card ${complete?"complete":""}"><div class="day-index">D${day.day}</div><div><div class="day-head"><div><span class="task-day">MODULE ${moduleNumber} · ${escapeHtml(module.label)} · ${escapeHtml(module.days)}</span><h3 class="day-title">${escapeHtml(day.title)} <span class="day-duration">${day.duration}</span></h3></div><span class="status">${escapeHtml(statusText)}</span></div><p class="day-objective" data-pretext>${escapeHtml(day.objective)}</p><div class="day-detail-grid"><div class="day-detail"><strong>핵심 내용</strong> · ${day.topics.map(escapeHtml).join(" · ")}</div><div class="day-detail"><strong>실습</strong> · ${escapeHtml(day.practice)}</div><div class="day-detail"><strong>산출물</strong> · ${escapeHtml(day.output)}</div><div class="day-check"><strong>완료 기준</strong> · ${escapeHtml(day.check)}</div></div></div></article>`}
    function moduleAttendanceText(moduleNumber){const module=participant.modules[moduleNumber];return module.dates.map((date,index)=>`${date} ${module.attendance[index]}`).join(" · ")}
    function renderCurriculumPage(page,start,end,title,subtitle){const count=participant.participationCount,total=participant.totalAppliedSessions,rate=total?Math.round(count/total*100):0;return `<section class="sheet" id="page-${page}">${pageHeader(page,title,subtitle)}${page===1?`<div class="profile-strip"><div><h2 class="profile-name" contenteditable="true">${escapeHtml(participant.name)}</h2><p class="profile-meta">${participant.status} · ${participant.team} · No. ${participant.number}</p></div><div class="profile-contact"><div>${participant.email}</div><div>참여 범위 · ${participant.startingPoint}</div></div></div><div class="overview-row"><div class="overview-item"><strong>모듈 1</strong><span>D1–D2 · 신청 · ${escapeHtml(participant.modules[1].status)}</span></div><div class="overview-item"><strong>모듈 2</strong><span>D3–D6 · 신청 · ${escapeHtml(participant.modules[2].status)}</span></div><div class="overview-item"><strong>모듈 3</strong><span>D7–D10 · 신청 · ${escapeHtml(participant.modules[3].status)}</span></div><div class="overview-item"><strong>${participant.absenceCount}회</strong><span>시트 기준 결석 횟수</span></div></div><p class="goal-note"><strong>시트 반영:</strong> 날짜별 출석 · 모듈 1 ${moduleAttendanceText(1)} / 모듈 2 ${moduleAttendanceText(2)} / 모듈 3 ${moduleAttendanceText(3)}.</p>`:""}<div class="section-heading"><div><p class="brand-kicker">CURRICULUM · PART ${page}</p><h2>${page===1?"모듈 1 D1–D2 · 모듈 2 D3–D5":"모듈 2 D6 · 모듈 3 D7–D10"}</h2></div><div class="progress"><div class="progress-label"><span>참여 회차</span><span>${count}/${total} · ${rate}%</span></div><div class="progress-track"><div class="progress-value" style="width:${rate}%"></div></div></div></div><div class="day-list">${curriculum.slice(start,end).map(renderDay).join("")}</div>${pageFooter(page)}</section>`}
    function renderAssignment(task){const moduleNumber=moduleForDay(task.day);const checked=completedTasks.has(task.id);return `<article class="task-card ${checked?"checked":""}" data-task-card="${task.id}"><input class="task-toggle" type="checkbox" id="${task.id}" data-task="${task.id}" ${checked?"checked":""} aria-label="Day ${task.day} 과제 수행 여부"/><label for="${task.id}"><span class="task-day">MODULE ${moduleNumber} · DAY ${task.day} ASSIGNMENT</span><h3>${escapeHtml(task.title)}</h3></label><p>${escapeHtml(task.description)}</p><div class="task-meta"><p><strong>제출물</strong> · ${escapeHtml(task.deliverable)}</p><p><strong>통과 기준</strong> · ${escapeHtml(task.criterion)}</p></div></article>`}
    function radarChart(values,labels){const cx=90,cy=82,radius=56;const point=(index,ratio)=>{const angle=(-90+index*120)*Math.PI/180;return [cx+Math.cos(angle)*radius*ratio,cy+Math.sin(angle)*radius*ratio]};const polygon=(ratio)=>labels.map((_,index)=>point(index,ratio).join(",")).join(" ");const valuePolygon=values.map((value,index)=>point(index,value/100).join(",")).join(" ");const axes=labels.map((_,index)=>{const [x,y]=point(index,1);return `<line class="radar-axis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`}).join("");const dots=values.map((value,index)=>{const [x,y]=point(index,value/100);return `<circle class="radar-dot" cx="${x}" cy="${y}" r="3"/>`}).join("");const labelNodes=labels.map((label,index)=>{const [x,y]=point(index,1.28);return `<text class="radar-label" x="${x}" y="${y+3}">${escapeHtml(label)}</text>`}).join("");return `<svg class="radar-chart" viewBox="0 0 180 170" role="img" aria-label="${escapeHtml(labels.join(', '))} 스파이더 그래프">${[.25,.5,.75,1].map((ratio)=>`<polygon class="radar-gridline" points="${polygon(ratio)}"/>`).join("")}${axes}<polygon class="radar-area" points="${valuePolygon}"/>${dots}${labelNodes}</svg>`}
    function renderStatusRows(data){return Object.entries(data).map(([module,item])=>`<div class="status-row"><strong>모듈 ${module}</strong><span class="status-badge ${item.value===100?'done':''}">${escapeHtml(item.status)}</span></div>`).join("")}
    function renderAnalyticsPage(){const style=participant.learningStyle;const assignmentValues=Object.values(participant.assignmentSubmission).map((item)=>item.value);const completionValues=Object.values(participant.moduleCompletion).map((item)=>item.participationValue??item.value);const labels=["모듈 1","모듈 2","모듈 3"];return `<section class="sheet" id="page-3">${pageHeader(3,"학습성향 & 진행 분석","개인 학습성향과 모듈별 과제 제출·이수 현황")}<div class="analysis-hero"><article class="analysis-primary"><p class="panel-kicker">LEARNING STYLE PROFILE</p><h2>${escapeHtml(style.summary)}</h2><p>시각 자료로 전체 구조를 먼저 파악하고, 직접 시도와 팀 논의를 통해 빠르게 이해를 확장하는 유형입니다.</p></article><div class="trait-grid"><div class="trait-card"><span>감각 유형</span><strong>시각형</strong><small>6 / 14</small></div><div class="trait-card"><span>정보 처리</span><strong>적극형</strong><small>5 / 6</small></div><div class="trait-card"><span>이해 방식</span><strong>총체적</strong><small>5 / 7</small></div></div></div><div class="style-matrix"><article class="style-panel"><h3>감각 유형 · 14문항</h3><div class="bar-row primary"><span>시각형</span><div class="bar-track"><div class="bar-value" style="width:43%"></div></div><b>6</b></div><div class="bar-row"><span>청각형</span><div class="bar-track"><div class="bar-value" style="width:21%"></div></div><b>3</b></div><div class="bar-row"><span>신체감각형</span><div class="bar-track"><div class="bar-value" style="width:36%"></div></div><b>5</b></div></article><article class="style-panel"><h3>정보 처리 · 6문항</h3><div class="bar-row primary"><span>적극형</span><div class="bar-track"><div class="bar-value" style="width:83%"></div></div><b>5</b></div><div class="bar-row"><span>숙고형</span><div class="bar-track"><div class="bar-value" style="width:17%"></div></div><b>1</b></div></article><article class="style-panel"><h3>이해 방식 · 7문항</h3><div class="bar-row"><span>순차적</span><div class="bar-track"><div class="bar-value" style="width:29%"></div></div><b>2</b></div><div class="bar-row primary"><span>총체적</span><div class="bar-track"><div class="bar-value" style="width:71%"></div></div><b>5</b></div></article></div><section class="learning-guide"><div><h3>맞춤 학습 전략</h3><p>${escapeHtml(style.recommendation)}</p></div><div><h3>학습 목표 & 기대</h3><p>${escapeHtml(style.goal)}<br>${escapeHtml(style.expectation)}</p></div></section><div class="radar-grid"><article class="radar-card">${radarChart(assignmentValues,labels)}<div><p class="panel-kicker">ASSIGNMENT SUBMISSION</p><h3>모듈별 과제 제출</h3><p>제출 O=100, 미제출 X=0으로 시각화했습니다.</p><div class="status-list">${renderStatusRows(participant.assignmentSubmission)}</div></div></article><article class="radar-card">${radarChart(completionValues,labels)}<div><p class="panel-kicker">MODULE COMPLETION</p><h3>모듈별 이수·참여 회차</h3><p>실제 참여 회차를 모듈별 전체 회차 대비 비율로 표시했습니다.</p><div class="status-list">${renderStatusRows(participant.moduleCompletion)}</div></div></article></div>${pageFooter(3)}</section>`}
    function renderPortfolioPage(){return '<section class="sheet" id="page-4">'+pageHeader(4,"Last Project Product","팀 최종 프로젝트 정리 및 역할별 전문가 평가")+"<div class=\"portfolio-hero\"><article class=\"portfolio-intro\"><p class=\"portfolio-label\">TEAM PROJECT · SPENDWISE</p><h2>SpendWise</h2><p>월수입과 저축 목표, 항목별 지출을 입력하면 AI가 빠졌을 수 있는 소비를 질문하고, 사용자가 확인한 금액을 반영해 지출 구조·저축 부족액·절감 후보를 보여주는 대화형 예산 진단 서비스입니다.</p></article><div class=\"portfolio-metrics\"><div class=\"portfolio-metric\"><strong>18 Tests</strong><span>백엔드 pytest 통과</span></div><div class=\"portfolio-metric\"><strong>3.0M</strong><span>대표 사례 월 지출</span></div><div class=\"portfolio-metric\"><strong>300K</strong><span>저축 목표 부족액</span></div><div class=\"portfolio-metric\"><strong>88/100</strong><span>역할별 종합 평가</span></div></div></div><div class=\"portfolio-grid\"><article class=\"portfolio-panel\"><p class=\"panel-kicker\">PROBLEM & SOLUTION</p><h3>누락 지출과 절감 판단</h3><p>카페·배달·구독 같은 반복 소액 지출이 빠지면 남는 돈과 저축 가능액을 오판하기 쉽습니다. 직접 입력 뒤 AI 추가 질문으로 누락 후보를 확인하고, 서버 계산 결과와 절감 이유를 웹 보고서로 제공합니다.</p></article><article class=\"portfolio-panel\"><p class=\"panel-kicker\">TARGET USER</p><h3>자산관리가 필요한 청년층</h3><p>청년 직장인, 사회초년생, 대학생을 대상으로 하며 MVP는 월수입 300만 원을 모두 지출해 저축하지 못하는 가상 직장인의 한 번의 진단 흐름에 집중했습니다.</p></article><article class=\"portfolio-panel wide\"><p class=\"panel-kicker\">KEY EXPERIENCE</p><h3>입력에서 맞춤형 절감안까지</h3><ul class=\"feature-list\"><li><strong>Goal First</strong> · 월수입과 저축 예정액으로 가용 지출 예산 설정</li><li><strong>AI Follow-up</strong> · 소비 메모를 바탕으로 누락 지출 질문</li><li><strong>Verified Calculation</strong> · 확인 금액 반영 후 잔여금·부족액 계산</li><li><strong>Action Report</strong> · 지출 구성과 절감 후보·선정 이유 제공</li></ul></article><article class=\"portfolio-panel\"><p class=\"panel-kicker\">TECH & ARCHITECTURE</p><h3>구현 구성</h3><div class=\"stack-row\"><span class=\"stack-tag\">React</span><span class=\"stack-tag\">Vite</span><span class=\"stack-tag\">FastAPI</span><span class=\"stack-tag\">Nemotron 3.5</span><span class=\"stack-tag\">pytest</span><span class=\"stack-tag\">PII Guard</span></div><p style=\"margin-top:2mm\">금액 계산은 FastAPI가 담당하고 AI는 질문과 설명을 생성합니다. 호출 실패 시 규칙 기반 엔진으로 전환하며 식별정보 패턴은 저장·외부 전송 전에 차단합니다.</p></article><article class=\"portfolio-panel\"><p class=\"panel-kicker\">VALIDATION</p><h3>통합 검증과 한계</h3><p>pytest 18개, Vite 빌드, 웹 진입부터 보고서 조회까지의 HTTP 흐름, 가상 식별정보 HTTP 400 차단과 NVIDIA 실연동을 확인했습니다. 다만 기본 지출 재제출 뒤 확인 금액이 누락되는 상태 갱신 결함과 정규식 오탐 검증이 남았습니다.</p></article></div><section class=\"evaluation\"><div class=\"evaluation-head\"><div><p class=\"panel-kicker\">EXPERT REVIEW</p><h3>기획·디자인·개발 관점 전문가 평가</h3></div><div class=\"score\">88 / 100</div></div><div class=\"score-grid\" style=\"grid-template-columns:repeat(3,1fr)\"><div class=\"score-item\"><span>기획자 관점</span><strong>89</strong></div><div class=\"score-item\"><span>디자이너 관점</span><strong>85</strong></div><div class=\"score-item\"><span>개발자 관점</span><strong>91</strong></div></div><div class=\"review-grid\"><div><h4>강점</h4><p>하루 MVP에 맞게 페르소나와 대표 수치를 좁히고, AI와 결정적 계산의 책임을 분리했습니다. 실패 시 규칙 기반 대체, 개인정보 사전 차단, 자동 테스트와 HTTP 통합 검증까지 연결한 점이 강합니다.</p></div><div><h4>개선 제안</h4><p>추가 지출 상태가 재제출 과정에서 소실되는 결함을 먼저 수정하고 회귀 테스트를 추가해야 합니다. 실제 사용자에게 질문의 회상 효과와 절감안 이해도를 검증하고 이력 저장·재진단·내보내기 우선순위를 정해야 합니다.</p></div></div><p class=\"expert-quote\">“AI가 계산을 대신하지 않고 누락 탐색과 설명에 집중한 구조가 좋습니다. 상태 일관성 결함을 해결하고 실제 사용자의 행동 변화까지 측정하면 완성도 높은 금융 UX 사례가 됩니다.” · 역할별 포트폴리오 평가</p></section>"+pageFooter(4)+'</section>'}
    document.getElementById("document").innerHTML=[renderCurriculumPage(1,0,5,"AI Agent 10 Days Learning Portfolio","요구사항에서 릴리즈까지 이어지는 실전 SW 프로젝트 과정"),renderCurriculumPage(2,5,10,"AI Agent 10 Days Learning Portfolio","구현, 검증, 보안, 비즈니스, 릴리즈의 완성"),renderAnalyticsPage(),renderPortfolioPage()].join("");

    const radarCards=analyticsPage.querySelectorAll(".radar-card");radarCards[0].querySelectorAll("p")[1].textContent="과제 제출 현황의 O=100, X·미제출=0으로 반영했습니다.";radarCards[1].querySelectorAll("p")[1].textContent="출석 현황의 실제 참여 회차 비율을 그래프로 표시하고, 이수 여부와 참여 카운트를 함께 적었습니다.";
    function updateTaskState(){document.querySelectorAll("[data-task]").forEach((input)=>{const card=document.querySelector(`[data-task-card="${input.dataset.task}"]`);card.classList.toggle("checked",input.checked)});const selected=[...document.querySelectorAll("[data-task]:checked")].map((input)=>input.dataset.task);localStorage.setItem("swlanding-completed-tasks",JSON.stringify(selected));document.getElementById("task-count").textContent=selected.length}document.querySelectorAll("[data-task]").forEach((input)=>input.addEventListener("change",updateTaskState));
    (async function initPretext(){await document.fonts.ready;const elements=[...document.querySelectorAll("[data-pretext]")];try{const{prepare,layout}=await import("https://esm.sh/@chenglou/pretext");const prepared=new Map();const prepareElement=(el)=>prepared.set(el,prepare(el.textContent,getComputedStyle(el).font));elements.forEach(prepareElement);const relayout=()=>prepared.forEach((handle,el)=>{if(window.matchMedia("print").matches)return;const lineHeight=parseFloat(getComputedStyle(el).lineHeight);const result=layout(handle,el.clientWidth,lineHeight);el.style.minHeight=`${Math.ceil(result.height)}px`});new ResizeObserver(relayout).observe(document.body);elements.filter((el)=>el.contentEditable==="true").forEach((el)=>{new MutationObserver(()=>{prepareElement(el);relayout()}).observe(el,{characterData:true,subtree:true,childList:true})});relayout()}catch(error){console.info("Pretext CDN을 사용할 수 없어 브라우저 기본 줄바꿈을 사용합니다.")}})();
