<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>프레시샌드 모바일 주문 | Fresh Route</title>
  <!-- Pretendard, Gmarket Sans, IBM Plex Mono 웹폰트 로드 (오프라인 시 시스템 및 Noto Sans KR 폴백) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">본문으로 바로가기</a>

  <!-- 시뮬레이션/테스트 컨트롤 바 (기획서의 예외 상태를 즉시 검증 가능) -->
  <aside class="sim-toolbar" aria-label="예외 및 상태 테스트 도구">
    <div class="sim-toolbar-header">
      <span class="sim-badge">TEST MODE</span>
      <button type="button" id="toggle-sim-btn" class="sim-toggle-btn" aria-expanded="false" aria-controls="sim-panel">
        예외 상태 테스트 열기
      </button>
    </div>
    <div id="sim-panel" class="sim-panel" hidden>
      <div class="sim-grid">
        <label class="sim-check">
          <input type="checkbox" id="sim-invalid-link" />
          <span>유효하지 않은 매장 링크</span>
        </label>
        <label class="sim-check">
          <input type="checkbox" id="sim-closed-hours" />
          <span>영업시간 종료 상태</span>
        </label>
        <label class="sim-check">
          <input type="checkbox" id="sim-order-paused" />
          <span>일시적 주문 중지 (관리자 연동)</span>
        </label>
        <label class="sim-check">
          <input type="checkbox" id="sim-network-offline" />
          <span>네트워크 연결 끊김</span>
        </label>
      </div>
      <div class="sim-row">
        <label for="sim-payment-behavior" class="sim-select-label">결제 시뮬레이션 결과</label>
        <select id="sim-payment-behavior" class="sim-select">
          <option value="SUCCESS">정상 결제 성공</option>
          <option value="FAIL">결제 실패 (한도 초과·승인 거절)</option>
          <option value="UNCERTAIN">결제 결과 확인 중 (응답 지연·중복 결제 방지)</option>
        </select>
      </div>
    </div>
  </aside>

  <!-- 모바일 앱 컨테이너 (Fresh Route 콘셉트) -->
  <div class="mobile-shell" id="app-shell">
    <!-- 네트워크 오프라인 배너 -->
    <div id="offline-banner" class="alert-banner alert-error" role="alert" hidden>
      <svg class="status-svg-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      <div class="alert-banner-text">
        <strong>네트워크 연결이 끊어졌어요.</strong>
        <span>담아둔 메뉴는 그대로 보관 중입니다. 연결을 확인한 뒤 다시 시도해 주세요.</span>
      </div>
      <button type="button" id="retry-network-btn" class="btn-inline-retry">다시 연결</button>
    </div>

    <!-- 공통 상단 영역: 매장명, 화면 제목, 장바구니 -->
    <header class="app-header">
      <div class="header-left">
        <button type="button" id="header-back-btn" class="icon-btn" aria-label="이전 화면으로 이동" hidden>
          <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" />
          </svg>
          <span class="sr-only">이전 화면</span>
        </button>
        <div class="header-titles">
          <span id="header-store-name" class="header-store-name">프레시샌드 강남역점</span>
          <h1 id="header-screen-title" class="header-screen-title">주문 시작</h1>
        </div>
      </div>
      <div class="header-right">
        <button type="button" id="header-order-status-btn" class="header-pill-btn" aria-label="진행 중인 주문 상태 확인" hidden>
          <svg class="status-svg-icon-sm" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="currentColor" />
          </svg>
          <span id="header-active-order-label">주문 상태</span>
        </button>
        <button type="button" id="header-cart-btn" class="header-cart-btn" aria-label="장바구니 열기">
          <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
            <path d="M3 6h18" />
            <path d="M16 10a4 4 0 01-8 0" />
          </svg>
          <span class="cart-btn-text">장바구니</span>
          <span id="header-cart-count" class="cart-count-badge" aria-live="polite">0</span>
        </button>
      </div>
    </header>

    <!-- 실시간 알림 토스트 -->
    <div id="live-toast" class="live-toast" role="status" aria-live="polite" hidden></div>

    <!-- 본문 영역 (한 화면에 하나의 의사결정이 중심이 되도록 구성) -->
    <main id="main-content" class="app-main" tabindex="-1"></main>

    <!-- 공통 하단 고정 주문 바: 금액과 주 행동 버튼을 고정 -->
    <footer id="app-footer" class="app-footer">
      <div id="footer-reason-box" class="footer-reason" role="status" aria-live="polite" hidden>
        <svg class="status-svg-icon-sm" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <span id="footer-reason-text"></span>
      </div>
      <div class="footer-summary-row">
        <div class="footer-price-info">
          <span id="footer-price-label" class="footer-price-label">현재 주문 금액</span>
          <strong id="footer-price-value" class="footer-price-value">0원</strong>
        </div>
        <div class="footer-actions" id="footer-actions">
          <button type="button" id="footer-primary-btn" class="btn-primary btn-thumb">
            주문 시작
          </button>
        </div>
      </div>
    </footer>
  </div>

  <script src="../shared/menu-data.js"></script>
  <script src="../shared/store.js"></script>
  <script src="app.js"></script>
</body>
</html>
