  <script id="auth-guard">
    (function () {
      function getCookie(name) {
        var prefix = name + "=";
        var cookies = document.cookie.split(";");
        for (var i = 0; i < cookies.length; i += 1) {
          var cookie = cookies[i].trim();
          if (cookie.indexOf(prefix) === 0) return decodeURIComponent(cookie.substring(prefix.length));
        }
        return null;
      }
      var user = getCookie("currentUser");
      if (!user) {
        try {
          var session = JSON.parse(localStorage.getItem("currentUserSession") || "null");
          if (session && Date.now() < session.expiresAt) user = session.value;
        } catch (error) { console.error(error); }
      }
      if (!user && window.location.protocol !== "file:") window.location.href = "../login/login.html";
    })();
  </script>

  <script>
    (function () {
      "use strict";
      var query = new URLSearchParams(window.location.search);
      var day = Number(query.get("day") || 1);
      var type = query.get("type") === "mission" ? "mission" : "skill";
      var id = Number(query.get("id") || 1);
      var dayData = window.LMS_CURRICULUM && window.LMS_CURRICULUM[day];
      var list = dayData ? (type === "skill" ? dayData.skills : dayData.missions) : [];
      var item = list[id - 1];
      var inputFiles = window.LMS_INPUT_FILES;
      if (!item) { document.getElementById("app").innerHTML = '<div class="empty">학습 콘텐츠를 찾을 수 없습니다.</div>'; return; }
      if (type === "mission") document.body.classList.add("mission");

      function text(idName, value) { document.getElementById(idName).textContent = value; }
      function link(idName, href) { document.getElementById(idName).href = href; }
      function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]; }); }

      document.title = "Day " + day + ". " + item.title + " | 대구 DIP SW 랜딩";
      text("navTheme", "Day " + day + " · " + dayData.theme);
      text("dayBadge", "DAY " + day);
      text("typeBadge", type === "skill" ? "DEVELOPER SKILL " + id : "PLANNER × DEVELOPER MISSION " + id);
      text("themeBadge", dayData.theme);
      text("title", item.title);
      text("cardSummary", item.pbl ? item.pbl.brief : item.card);
      text("artifact", item.artifact);
      link("classroomLink", "../day" + day + "/day" + day + "-ai-classroom.html");
      link("boardLink", "../day" + day + "/day" + day + "-ai-classroom_detail_task.html");

      if (item.pbl) {
        var scenario = item.pbl.scenario;
        document.getElementById("pblCard").innerHTML =
          '<h2>PBL 프로젝트 브리프</h2>' +
          '<h3>연속 프로젝트</h3><p>' + escapeHtml(dayData.project) + '</p>' +
          '<h3>Persona 기반 예시 상황</h3>' +
          '<div class="persona-scenario">' +
            '<div class="scenario-meta"><div><strong>학생이 맡을 역할</strong><span>' + escapeHtml(scenario.persona) + '</span></div><div><strong>함께 고려할 이해관계자</strong><span>' + escapeHtml(scenario.stakeholder) + '</span></div></div>' +
            '<p><strong>상황:</strong> ' + escapeHtml(scenario.situation) + '</p>' +
            '<blockquote class="scenario-dialogue">' + escapeHtml(scenario.dialogue) + '</blockquote>' +
            '<p class="scenario-assignment"><strong>이 상황에서 해야 할 일:</strong> ' + escapeHtml(scenario.assignment) + '</p>' +
          '</div>' +
          '<h3>이번에 해결할 문제</h3><p>' + escapeHtml(item.pbl.brief) + '</p>' +
          '<h3>제공 자료·시작 파일</h3>' + inputFiles.render(day, type, id, item, escapeHtml) +
          '<h3>학생이 직접 수행할 과제</h3><ol class="steps">' + item.pbl.work.map(function (value, index) { return '<li><div><strong>' + escapeHtml(value) + '</strong><span class="step-detail">' + escapeHtml(item.pbl.explanation[index]) + '</span></div></li>'; }).join("") + '</ol>' +
          '<h3>완료 검수 기준</h3><ul>' + item.pbl.done.map(function (value) { return '<li>' + escapeHtml(value) + '</li>'; }).join("") + '</ul>';
        inputFiles.bind(document.getElementById("pblCard"), day, type, id, item);
        text("outputExample", item.pbl.example);
      }

      var steps;
      var checks;
      var prompt;
      if (type === "skill") {
        text("principleTitle", "개발자가 직접 수행합니다");
        text("principleText", "AI는 완성본을 대신 만드는 Agent가 아니라 개념을 질문하고 초안을 리뷰하며 반례를 제시하는 Tutor·Reviewer입니다. 먼저 자신의 초안과 가설을 만든 뒤 AI를 사용하세요.");
        document.getElementById("learningCard").innerHTML =
          '<h2>개발자 직접 학습 목표</h2><h3>익혀야 할 개념</h3><p>' + escapeHtml(item.concept) + '</p>' +
          '<h3>Hands-on 실습</h3><p>' + escapeHtml(item.practice) + '</p>' +
          '<h3>완료 판단</h3><p>' + escapeHtml(item.check) + '</p>' +
          '<h3>학습 순서</h3><ol class="steps"><li>AI를 열기 전에 현재 이해와 초안을 직접 작성합니다.</li><li>AI에 정답 대신 개념 질문·반례·리뷰를 요청합니다.</li><li>제안을 근거와 테스트로 확인하고 코드·설계를 직접 수정합니다.</li><li>무엇을 왜 바꿨는지 자신의 언어로 설명하고 기록합니다.</li></ol>';
        checks = (item.pbl ? item.pbl.done : []).concat(["AI 사용 전 자신의 초안 또는 가설을 남겼다.", "AI의 제안 중 채택·기각 항목과 이유를 기록했다.", "산출물에 학습한 개념과 남은 질문을 정리했다."]);
        prompt = "당신은 완성 코드를 대신 작성하는 Agent가 아니라 개발 학습을 돕는 소크라테스식 튜터이자 리뷰어입니다.\n\n프로젝트: " + dayData.project + "\n학습 주제: " + item.title + "\n내 역할: " + item.pbl.scenario.persona + "\n현재 상황: " + item.pbl.scenario.situation + "\n해결할 문제: " + (item.pbl ? item.pbl.brief : item.practice) + "\n제공 자료: " + (item.pbl ? item.pbl.inputs.join(", ") : "학습 페이지 자료") + "\n내가 직접 수행할 작업:\n- " + (item.pbl ? item.pbl.work.join("\n- ") : item.practice) + "\n완료 기준:\n- " + (item.pbl ? item.pbl.done.join("\n- ") : item.check) + "\n\n규칙:\n1. 처음부터 완성본이나 정답을 주지 마세요.\n2. 먼저 내 현재 이해, 초안, 선택 근거를 질문하세요.\n3. 한 번에 하나의 힌트와 반례를 제시하세요.\n4. 내가 작성한 코드·설계를 개념, 경계값, 실패 사례 관점에서 리뷰하세요.\n5. 제안은 검증 가능한 테스트 또는 확인 방법과 함께 주세요.\n6. 마지막에는 내가 직접 설명하도록 확인 질문 3개를 주세요.\n\n첫 단계로, 제공 자료를 확인하기 전에 내가 세워야 할 가설과 작업 순서를 질문해주세요.";
      } else {
        text("principleTitle", "기획자와 개발자가 함께 판단합니다");
        text("principleText", "AI Agent의 결과는 결정이 아니라 검토 대상입니다. 기획자는 목적·정책·사용자 영향을, 개발자는 시스템 제약·검증 증거·복구 방식을 제시하고 공동 결정 로그를 남깁니다.");
        document.getElementById("learningCard").innerHTML =
          '<h2>AI Agent 협업 이슈</h2><h3>발생 상황</h3><p>' + escapeHtml(item.issue) + '</p>' +
          '<h3>기획자 역할</h3><p>' + escapeHtml(item.planner) + '</p>' +
          '<h3>개발자 역할</h3><p>' + escapeHtml(item.developer) + '</p>' +
          '<h3>협업 순서</h3><ol class="steps"><li>AI 결과에서 사실·가정·누락 질문을 분리합니다.</li><li>기획자는 사용자·정책·범위 근거를 제시합니다.</li><li>개발자는 기술 제약·실패 사례·검증 증거를 제시합니다.</li><li>결정, 담당자, 완료 조건, 재검토 시점을 공동 기록합니다.</li></ol>';
        checks = (item.pbl ? item.pbl.done : []).concat(["AI 결과의 사실·가정·질문을 구분했다.", "기획자와 개발자의 근거를 모두 기록했다.", "담당자와 테스트 가능한 완료 조건을 합의했다."]);
        prompt = "당신은 기획자와 개발자의 결정을 대신하는 Agent가 아니라, 협업 이슈를 구조화하는 퍼실리테이터입니다.\n\n프로젝트: " + dayData.project + "\n미션: " + item.title + "\n학생 팀의 역할: " + item.pbl.scenario.persona + "\n현재 상황: " + item.pbl.scenario.situation + "\n발생 이슈: " + item.issue + "\n제공 자료: " + (item.pbl ? item.pbl.inputs.join(", ") : "미션 페이지 자료") + "\n학생 팀이 수행할 작업:\n- " + (item.pbl ? item.pbl.work.join("\n- ") : item.card) + "\n완료 기준:\n- " + (item.pbl ? item.pbl.done.join("\n- ") : item.artifact) + "\n기획자 확인 사항: " + item.planner + "\n개발자 확인 사항: " + item.developer + "\n\n규칙:\n1. 제공되지 않은 정책·수치·기술 사실을 만들지 마세요.\n2. 내용을 [확인된 사실 / AI의 가정 / 누락 질문 / 위험]으로 분리하세요.\n3. 기획자에게 물을 질문과 개발자에게 물을 질문을 구분하세요.\n4. 하나의 정답 대신 선택지, 영향, 검증 방법을 제시하세요.\n5. 최종 결정은 비워 두고 담당자·근거·완료 조건을 기록할 표를 만드세요.\n\n먼저 제공 자료별 검토 순서와 기획자·개발자의 첫 작업을 구분해서 제시해주세요.";
      }
      text("prompt", prompt);

      document.getElementById("downloadBrief").addEventListener("click", function () {
        var roleLabel = type === "skill" ? "Developer Skill" : "Planner × Developer Mission";
        var brief = "# Day " + day + " " + roleLabel + " " + id + " — " + item.title + "\n\n" +
          "## 연속 프로젝트\n\n" + dayData.project + "\n\n" +
          "## Persona 기반 예시 상황\n\n- **학생 역할:** " + item.pbl.scenario.persona + "\n- **이해관계자:** " + item.pbl.scenario.stakeholder + "\n- **상황:** " + item.pbl.scenario.situation + "\n- **현장 대화:** " + item.pbl.scenario.dialogue + "\n- **이 상황에서 해야 할 일:** " + item.pbl.scenario.assignment + "\n\n" +
          "## 해결할 문제\n\n" + (item.pbl ? item.pbl.brief : item.card) + "\n\n" +
          "## 제공 자료·시작 파일\n\n" + (item.pbl ? item.pbl.inputs.map(function (value) { return "- `" + value + "`"; }).join("\n") : "- 학습 페이지 자료") + "\n\n" +
          "## 학생 수행 과제와 설명\n\n" + (item.pbl ? item.pbl.work.map(function (value, index) { return (index + 1) + ". **" + value + "**\n   - 수행 설명: " + item.pbl.explanation[index]; }).join("\n") : "1. " + item.card) + "\n\n" +
          "## 제출 산출물\n\n- `" + item.artifact + "`\n- AI 사용 전 초안 또는 가설\n- AI 제안의 채택·수정·기각 기록\n\n" +
          "## 완료 검수 기준\n\n" + (item.pbl ? item.pbl.done.map(function (value) { return "- [ ] " + value; }).join("\n") : "- [ ] 산출물 완성") + "\n\n" +
          "## 실제 산출물 예시\n\n```\n" + (item.pbl ? item.pbl.example : "산출물 예시") + "\n```\n\n" +
          "## 팀 회고\n\n- AI 없이 먼저 판단한 내용:\n- AI가 발견한 반례 또는 누락:\n- 채택한 제안과 근거:\n- 기각한 제안과 근거:\n- 다음 단계에서 확인할 질문:\n";
        var blob = new Blob([brief], { type: "text/markdown;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = "day" + day + "-" + type + id + "-pbl-brief.md";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
      });

      var storageKey = "lms-progress-day" + day + "-" + type + "-" + id;
      var saved = [];
      try { saved = JSON.parse(localStorage.getItem(storageKey) || "[]"); } catch (error) { saved = []; }
      var checklist = document.getElementById("checklist");
      checks.forEach(function (label, index) {
        var row = document.createElement("div"); row.className = "check";
        var input = document.createElement("input"); input.type = "checkbox"; input.id = "check-" + index; input.checked = Boolean(saved[index]);
        var labelNode = document.createElement("label"); labelNode.htmlFor = input.id; labelNode.textContent = label;
        input.addEventListener("change", saveProgress); row.appendChild(input); row.appendChild(labelNode); checklist.appendChild(row);
      });
      function saveProgress() {
        var state = Array.prototype.map.call(checklist.querySelectorAll("input"), function (input) { return input.checked; });
        localStorage.setItem(storageKey, JSON.stringify(state));
        text("progressText", state.filter(Boolean).length + "/" + state.length);
      }
      saveProgress();
      document.getElementById("resetProgress").addEventListener("click", function () { checklist.querySelectorAll("input").forEach(function (input) { input.checked = false; }); saveProgress(); });
      document.getElementById("copyPrompt").addEventListener("click", function () {
        navigator.clipboard.writeText(prompt).then(function () { text("copyPrompt", "복사 완료"); setTimeout(function () { text("copyPrompt", "프롬프트 복사"); }, 1200); });
      });

      var prevId = id - 1; var nextId = id + 1; var prevType = type; var nextType = type;
      if (prevId < 1) { if (type === "mission") { prevType = "skill"; prevId = dayData.skills.length; } else { prevId = list.length; } }
      if (nextId > list.length) { if (type === "skill") { nextType = "mission"; nextId = 1; } else { nextId = 1; } }
      link("prevLink", "?day=" + day + "&type=" + prevType + "&id=" + prevId);
      link("nextLink", "?day=" + day + "&type=" + nextType + "&id=" + nextId);
      text("prevLink", "← " + (prevType === "skill" ? "Skill " : "Mission ") + prevId);
      text("nextLink", (nextType === "skill" ? "Skill " : "Mission ") + nextId + " →");
    })();
  </script>
  <script src="pre-learning-log.js"></script>
</body>
</html>
